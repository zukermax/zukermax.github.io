<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spotify connected — Goliath</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #faf8f2; color: #2b2620;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border: 1px solid #e7e0d2; border-radius: 12px; padding: 32px;
          max-width: 560px; width: calc(100% - 48px); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #7a7264; font-size: 14px; }
  code { display: block; background: #f4f0e6; border-radius: 8px; padding: 16px; margin: 16px 0;
         word-break: break-all; font-size: 13px; user-select: all; }
  button { background: #5c6f58; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px;
           font-size: 14px; cursor: pointer; }
  .err { color: #a34a3a; }
</style>
</head>
<body>
<div class="card" id="card"><h1>Finishing Spotify connection…</h1><p>Exchanging the code, one moment.</p></div>
<script>
(function () {
  var CLIENT_ID = 'd526b450e6bb4be399f0010754055813';
  var REDIRECT_URI = 'https://zukermax.github.io/spotify-callback';
  var LS = 'goliath.spotify.tokens';
  var card = document.getElementById('card');
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), state = q.get('state'), err = q.get('error');

  function fail(msg, showCode) {
    card.innerHTML = '<h1 class="err">Connection hit a snag</h1><p>' + msg + '</p>' +
      (showCode ? '<p>Copy this code and paste it back in chat instead:</p><code id="c"></code>' +
       '<button id="b">Copy code</button>' : '');
    if (showCode) {
      document.getElementById('c').textContent = code;
      document.getElementById('b').onclick = function () {
        navigator.clipboard.writeText(code);
        document.getElementById('b').textContent = 'Copied';
      };
    }
  }

  if (err) { fail('Spotify said: ' + err.replace(/</g, '&lt;')); return; }
  if (!code) { fail('No code arrived. Open the approval link again.'); return; }

  // Verifier lives in localStorage now (survives a new-tab return) with a
  // sessionStorage fallback for logins started before that change.
  function stored(k) {
    try { var v = localStorage.getItem(k); if (v) return v; } catch (e) {}
    try { return sessionStorage.getItem(k); } catch (e) { return null; }
  }
  var verifier = stored('goliath.spk.verifier');
  var savedState = stored('goliath.spk.state');
  if (!verifier || state !== savedState) {
    // Different browser/tab than the one that started login — fall back to manual code.
    fail('This browser did not start the login. Paste the code in chat and it will be finished there.', true);
    return;
  }

  fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code', code: code, redirect_uri: REDIRECT_URI,
      client_id: CLIENT_ID, code_verifier: verifier,
    }),
  }).then(function (r) {
    if (!r.ok) throw new Error('exchange ' + r.status);
    return r.json();
  }).then(function (t) {
    localStorage.setItem(LS, JSON.stringify({
      access_token: t.access_token, refresh_token: t.refresh_token,
      expires_at: Date.now() + t.expires_in * 1000,
    }));
    try { localStorage.removeItem('goliath.spk.verifier'); localStorage.removeItem('goliath.spk.state'); } catch (e) {}
    sessionStorage.removeItem('goliath.spk.verifier');
    sessionStorage.removeItem('goliath.spk.state');
    card.innerHTML = '<h1>Spotify connected</h1><p>Taking you back to your music…</p>';
    setTimeout(function () { location.href = '/#/culture/music'; }, 900);
  }).catch(function () {
    fail('The token exchange failed in this browser.', true);
  });
})();
</script>
</body>
</html>
